<component name="effect-fetch-error-demo">
  <var name="state" value="{}" mutable="true"></var>
  <derive
    name="status"
    expr="this.state.loading ? 'Loading...' : this.state.error ? 'Error' : 'Idle'">
  </derive>

  <div class="demo">
    <button id="load">Load Broken Endpoint</button>
    <p id="status">Status: {status}</p>
    <p id="error" class="error">{state.error}</p>
  </div>

  <event target="#load" type="click">
    <set name="state.loadNonce" expr="Date.now()"></set>
  </event>

  <fetch
    url="'https://example.com/demo-error.json'"
    into="state.data"
    loading="state.loading"
    error="state.error"
    deps="this.state.loadNonce"
    when="Boolean(this.state.loadNonce)"
    immediate="false">
  </fetch>
</component>
