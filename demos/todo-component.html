<component name="todo-box">
  <var name="todos" value="[]" mutable="true"></var>
  <var name="draft" value="''" mutable="true"></var>
  <derive name="remaining" expr="todos.filter((todo) => !todo.done).length"></derive>

  <function name="add">
    const text = draft.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    draft = '';
  </function>

  <style>
    .done span { text-decoration: line-through; opacity: 0.6; }
  </style>

  <div class="todo">
    <h2>HTMS Todo</h2>
    <form class="input-row" on:submit.prevent="add()">
      <input type="text" placeholder="Add a task" bind:value="draft" />
      <button type="submit" disabled="{!draft.trim()}">Add</button>
    </form>
    <ul>
      <repeat variable="todos" item="todo" index="i">
        <li class="todo-item" class:done="todo.done">
          <label>
            <input type="checkbox" bind:checked="todo.done" />
            <span>{todo.text}</span>
          </label>
          <button class="remove" type="button" aria-label="Remove" on:click="todos.splice(i, 1)">✕</button>
        </li>
      </repeat>
    </ul>
    <p class="summary" if="todos.length">{remaining} of {todos.length} left</p>
  </div>
</component>
