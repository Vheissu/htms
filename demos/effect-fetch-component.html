<component name="effect-fetch-demo">
  <var name="state" value="{}" mutable="true"></var>
  <derive
    name="status"
    expr="this.state.loading ? 'Loading...' : this.state.error ? 'Error' : this.state.quote ? 'Loaded' : 'Idle'">
  </derive>

  <div class="demo">
    <button id="load">Load Quote</button>
    <p id="status">Status: {status}</p>
    <blockquote id="quote">{state.quote.text}</blockquote>
    <p id="error" class="error">{state.error}</p>
  </div>

  <event target="#load" type="click">
    <set name="state.loadNonce" expr="Date.now()"></set>
  </event>

  <fetch
    url="'https://example.com/demo-quote.json'"
    into="state.quote"
    loading="state.loading"
    error="state.error"
    deps="this.state.loadNonce"
    when="Boolean(this.state.loadNonce)"
    immediate="false">
  </fetch>

  <!-- Effects are for side effects outside the template: here, telling the
       page that the request status changed. -->
  <effect deps="this.status" immediate="false">
    this.dispatchEvent(new CustomEvent('status-change', { detail: this.status, bubbles: true, composed: true }));
  </effect>
</component>
