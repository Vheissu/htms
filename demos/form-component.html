<component name="form-box">
  <var name="name" value="''" mutable="true"></var>
  <var name="email" value="''" mutable="true"></var>
  <var name="saved" value="null" mutable="true"></var>

  <div class="form">
    <form on:submit.prevent="saved = { name: name.trim(), email: email.trim() }">
      <label>Name <input autocomplete="off" bind:value="name" /></label>
      <label>Email <input type="email" autocomplete="off" bind:value="email" /></label>
      <button type="submit" disabled="{!name.trim() || !email.trim()}">Save</button>
    </form>
    <p id="summary">{saved ? 'Saved ' + saved.name + ' (' + saved.email + ')' : 'Fill out the form'}</p>
  </div>
</component>
