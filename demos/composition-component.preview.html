<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Run the Composition example and inspect the HTMS source that compiled it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
  <link rel="canonical" href="https://vheissu.github.io/htms/composition-component.preview.html">
  <title>Composition | HTMS Demo</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7fb;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #5d687a;
      --line: #dfe3ec;
      --accent: #d94828;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100% - 2rem, 72rem);
      min-height: 4.5rem;
      margin: auto;
      border-bottom: 1px solid var(--line);
    }

    header a {
      color: var(--ink);
      font-weight: 750;
      text-decoration: none;
    }

    header span {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .demo-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .demo-links a:last-child {
      color: var(--accent);
      font-size: 0.875rem;
    }

    main {
      display: grid;
      width: min(100% - 2rem, 72rem);
      min-height: calc(100dvh - 8.5rem);
      margin: auto;
      padding: clamp(2rem, 8vw, 7rem) 0;
      place-items: center;
    }

    .stage {
      width: min(100%, 48rem);
      padding: clamp(1.25rem, 5vw, 3.5rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: 0 1.5rem 4rem rgb(44 53 72 / 10%);
    }

    footer {
      width: min(100% - 2rem, 72rem);
      margin: auto;
      padding: 1rem 0 2rem;
      color: var(--muted);
      font: 0.8125rem/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent);
      outline-offset: 4px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --surface: #191f2a;
        --ink: #edf0f6;
        --muted: #a7b0c1;
        --line: #323b4a;
        --accent: #ff7657;
      }

      .stage {
        box-shadow: 0 1.5rem 4rem rgb(5 8 13 / 24%);
      }
    }

    @media (max-width: 40rem) {
      header {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 0.5rem;
      }

      .demo-links {
        width: 100%;
        justify-content: space-between;
      }

      .stage {
        border-radius: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="./">HTMS demos</a>
    <nav class="demo-links" aria-label="Demo links">
      <span>Composition</span>
      <a href="https://github.com/Vheissu/htms/blob/master/demos/composition-component.html">View source</a>
    </nav>
  </header>
  <main>
    <section class="stage" aria-label="Composition component">
      <composition-demo></composition-demo>
    </section>
  </main>
  <footer>&lt;composition-demo&gt;&lt;/composition-demo&gt;</footer>
  <script type="module" src="./composition-component.js"></script>
</body>
</html>
