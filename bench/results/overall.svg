<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-labelledby="overall-title overall-desc">
<title id="overall-title">Overall speed relative to vanilla JS</title>
<desc id="overall-desc">Geometric mean of the median time of nine js-framework-benchmark operations, divided by vanilla JS. Lower is faster. Vanilla JS 1.00×, HTMS 1.05×, Solid 1.09×, Svelte 5 1.14×, Vue 1.23×, React 1.66×.</desc>

  <style>
    .surface { fill: #fcfcfb; }
